<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent 自动复盘工作流架构</title>
  <desc id="desc">Cron 触发任务，滴答清单提供数据，AI Agent 和 Skills 处理后写入 Notion。凭据通过环境变量注入。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eaf1f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3b6f9e"/>
    </marker>
    <style>
      .title{font:700 34px 'Microsoft YaHei',Arial,sans-serif;fill:#17324d}
      .sub{font:400 17px 'Microsoft YaHei',Arial,sans-serif;fill:#587086}
      .boxTitle{font:700 22px 'Microsoft YaHei',Arial,sans-serif;fill:#17324d}
      .boxText{font:400 16px 'Microsoft YaHei',Arial,sans-serif;fill:#41586d}
      .small{font:400 14px 'Microsoft YaHei',Arial,sans-serif;fill:#587086}
      .flow{stroke:#3b6f9e;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="30" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" class="title">AI Agent 自动复盘工作流</text>
  <text x="600" y="96" text-anchor="middle" class="sub">定时触发 · 任务读取 · Agent 处理 · Notion 沉淀</text>

  <g filter="url(#shadow)">
    <rect x="70" y="185" width="220" height="180" rx="22" fill="#ffffff" stroke="#bfd1e2" stroke-width="2"/>
    <rect x="350" y="185" width="220" height="180" rx="22" fill="#ffffff" stroke="#bfd1e2" stroke-width="2"/>
    <rect x="630" y="185" width="220" height="180" rx="22" fill="#ffffff" stroke="#8eb5d8" stroke-width="3"/>
    <rect x="910" y="185" width="220" height="180" rx="22" fill="#ffffff" stroke="#bfd1e2" stroke-width="2"/>
  </g>

  <circle cx="180" cy="230" r="28" fill="#dceaf6"/>
  <path d="M180 213v18l12 8" stroke="#326b9b" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text x="180" y="292" text-anchor="middle" class="boxTitle">Cron 调度</text>
  <text x="180" y="324" text-anchor="middle" class="boxText">固定时间触发</text>
  <text x="180" y="346" text-anchor="middle" class="small">手动触发亦可</text>

  <rect x="427" y="207" width="66" height="48" rx="10" fill="#dceaf6"/>
  <path d="M440 224h40M440 237h28" stroke="#326b9b" stroke-width="4" stroke-linecap="round"/>
  <text x="460" y="292" text-anchor="middle" class="boxTitle">滴答清单</text>
  <text x="460" y="324" text-anchor="middle" class="boxText">CLI 获取未完成项</text>
  <text x="460" y="346" text-anchor="middle" class="small">MCP 获取完成项</text>

  <circle cx="740" cy="231" r="30" fill="#cfe3f4"/>
  <circle cx="730" cy="226" r="4" fill="#326b9b"/>
  <circle cx="750" cy="226" r="4" fill="#326b9b"/>
  <path d="M727 242q13 10 26 0" stroke="#326b9b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="740" y="292" text-anchor="middle" class="boxTitle">AI Agent</text>
  <text x="740" y="324" text-anchor="middle" class="boxText">选择并执行 Skills</text>
  <text x="740" y="346" text-anchor="middle" class="small">生成结构化复盘</text>

  <rect x="986" y="208" width="68" height="47" rx="9" fill="#dceaf6"/>
  <path d="M1000 220h40M1000 232h40M1000 244h28" stroke="#326b9b" stroke-width="4" stroke-linecap="round"/>
  <text x="1020" y="292" text-anchor="middle" class="boxTitle">Notion</text>
  <text x="1020" y="324" text-anchor="middle" class="boxText">创建或追加页面</text>
  <text x="1020" y="346" text-anchor="middle" class="small">形成可检索记录</text>

  <path d="M290 275H340" class="flow"/>
  <path d="M570 275H620" class="flow"/>
  <path d="M850 275H900" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="205" y="455" width="790" height="130" rx="22" fill="#17324d"/>
  </g>
  <text x="600" y="495" text-anchor="middle" style="font:700 21px 'Microsoft YaHei',Arial,sans-serif;fill:#ffffff">安全边界</text>
  <text x="600" y="530" text-anchor="middle" style="font:400 17px 'Microsoft YaHei',Arial,sans-serif;fill:#dceaf6">token、项目 ID 与页面 ID 仅由环境变量注入</text>
  <text x="600" y="560" text-anchor="middle" style="font:400 16px 'Microsoft YaHei',Arial,sans-serif;fill:#b9cee0">日志、数据库、生产提示词和真实任务不进入公开仓库</text>
  <path d="M600 455V390" stroke="#3b6f9e" stroke-width="4" stroke-dasharray="8 8"/>
</svg>
